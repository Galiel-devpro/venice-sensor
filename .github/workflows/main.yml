name: Compile Bash to Binary

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shc

      - name: Compile script
        run: |
          # Asegúrate de que este nombre coincida con tu archivo subido
          shc -f venice-usb.sh
          
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binary
          path: venice-usb.sh.x
